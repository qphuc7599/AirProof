[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airproof"
version = "0.2.0"
description = "Claim-safe simulation and audit framework for the AirProof research design"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43",
  "matplotlib>=3.9",
  "networkx>=3.3",
  "numpy>=2.0",
  "pandas>=2.2",
  "psutil>=6",
  "PyYAML>=6",
  "scikit-learn>=1.5",
  "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.9"]
modern-predictor = ["torch>=2.6", "rdata>=1.0"]

[project.scripts]
airproof = "airproof.cli:main"

[tool.setuptools.packages.find]
include = ["airproof*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
