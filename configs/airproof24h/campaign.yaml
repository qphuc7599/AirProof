campaign_version: airproof-24h-v1
status: frozen-before-local-run
base_config: f1.yaml
requested_workers: 12
hard_limit_hours: 23
minimum_free_disk_gb: 5
primary_independent_unit: world
paired_common_random_numbers: true
studies:
  e1:
    execution: simulation
    seeds: [10000, 10001, 10002, 10003, 10004, 10005, 10006, 10007, 10008, 10009,
            10010, 10011, 10012, 10013, 10014, 10015, 10016, 10017, 10018, 10019,
            10020, 10021, 10022, 10023, 10024, 10025, 10026, 10027, 10028, 10029]
    methods: [airproof, air_quality_dt, opportunistic_ttl]
    scenarios:
      - id: c1_best
        overrides: {network.availability: 1.0, network.outage_median_hours: 0, network.outage_p95_hours: 0, world.participation_skew: 1.0}
      - id: c2_participation
        overrides: {network.availability: 1.0, network.outage_median_hours: 0, network.outage_p95_hours: 0, world.participation_skew: 10.0}
      - id: c3_anchor
        overrides: {network.availability: 0.75, network.outage_median_hours: 6, network.outage_p95_hours: 24, world.participation_skew: 5.0}
      - id: c4_outage
        overrides: {network.availability: 0.4, network.outage_median_hours: 24, network.outage_p95_hours: 72, world.participation_skew: 1.0}
      - id: c5_severe
        overrides: {network.availability: 0.4, network.outage_median_hours: 24, network.outage_p95_hours: 72, world.participation_skew: 10.0}
  e3:
    execution: simulation
    seeds: [10000, 10001, 10002, 10003, 10004, 10005, 10006, 10007, 10008, 10009, 10010, 10011]
    methods: [factorial_000, factorial_001, factorial_010, factorial_011, factorial_100, factorial_101, factorial_110, factorial_111]
    scenarios:
      - id: nominal
        overrides: {network.availability: 0.75, network.outage_median_hours: 6, network.outage_p95_hours: 24, world.participation_skew: 5.0, attack.fraction: 0.0, attack.kind: clean}
      - id: severe
        overrides: {network.availability: 0.4, network.outage_median_hours: 24, network.outage_p95_hours: 72, world.participation_skew: 10.0, attack.fraction: 0.2, attack.kind: gradual_drift}
