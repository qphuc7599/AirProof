    execution: simulation
    seeds: [10000, 10001, 10002, 10003, 10004, 10005, 10006, 10007, 10008, 10009, 10010, 10011]
    methods: [airproof, squared_loss]
    scenarios:
      - id: clean
        overrides: {network.availability: 0.4, network.outage_median_hours: 24, network.outage_p95_hours: 72, world.participation_skew: 10.0, attack.fraction: 0.0, attack.kind: clean}
      - id: drift20
        overrides: {network.availability: 0.4, network.outage_median_hours: 24, network.outage_p95_hours: 72, world.participation_skew: 10.0, attack.fraction: 0.2, attack.kind: gradual_drift}
      - id: drift40
        overrides: {network.availability: 0.4, network.outage_median_hours: 24, network.outage_p95_hours: 72, world.participation_skew: 10.0, attack.fraction: 0.4, attack.kind: gradual_drift}
      - id: hotspot20
        overrides: {network.availability: 0.4, network.outage_median_hours: 24, network.outage_p95_hours: 72, world.participation_skew: 10.0, attack.fraction: 0.2, attack.kind: hotspot_suppression}
      - id: hotspot40
        overrides: {network.availability: 0.4, network.outage_median_hours: 24, network.outage_p95_hours: 72, world.participation_skew: 10.0, attack.fraction: 0.4, attack.kind: hotspot_suppression}
  e2a:
    execution: privacy_replay
    seeds: [11000, 11001, 11002, 11003, 11004, 11005, 11006, 11007, 11008, 11009, 11010, 11011]
    methods: [airproof]
    base_overrides: {privacy.private_eligibility: true, privacy.epsilon_user_max: 512.0}
    factors:
      privacy.epsilon_mean: [0.25, 0.5, 1.0, 2.0, 4.0]
      privacy.k_min: [10, 20, 50]
      privacy.epsilon_count: [0.1, 0.25, 0.5]
  e2l:
