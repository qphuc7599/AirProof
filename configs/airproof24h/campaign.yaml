      privacy.epsilon_user_max: [2.0, 4.0, 8.0]
      world.participation_skew: [1.0, 10.0]
  e2_poison:
    execution: privacy_replay
    seeds: [11200, 11201, 11202, 11203, 11204, 11205, 11206, 11207]
    methods: [airproof]
    base_overrides: {privacy.private_eligibility: false, privacy.epsilon_count: 0.0, privacy.epsilon_user_max: 192.0}
    scenarios:
      - id: clean
        overrides: {attack.fraction: 0.0, attack.kind: clean}
      - id: drift20
        overrides: {attack.fraction: 0.2, attack.kind: gradual_drift}
      - id: hotspot20
        overrides: {attack.fraction: 0.2, attack.kind: hotspot_suppression}
    factors:
      privacy.epsilon_mean: [0.5, 2.0]
  e5:
    execution: simulation
    methods: [airproof]
    generated_scalability_design: true
